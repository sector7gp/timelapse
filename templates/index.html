<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony's Timelapse</title>
    <style>
        :root {
            --bg-color: #0a192f;
            --container-bg: #112240;
            --text-color: #ccd6f6;
            --accent-green: #64ffda;
            --accent-blue: #57cbff;
            --btn-start: #28a745;
            --btn-stop: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            background: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: var(--accent-green);
            margin-bottom: 25px;
        }

        .preview {
            text-align: center;
            margin: 20px 0;
            min-height: 350px;
            background: #020c1b;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #233554;
            position: relative;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            max-height: 500px;
        }

        .live-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 25px;
        }

        .panel {
            background: #172a45;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #233554;
        }

        .panel h3 {
            margin-top: 0;
            color: var(--accent-blue);
            border-bottom: 1px solid #233554;
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
            margin-top: 10px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            background: #0a192f;
            border: 1px solid #233554;
            color: white;
            border-radius: 4px;
        }

        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }

        .range-val {
            float: right;
            font-size: 0.8em;
            color: var(--accent-green);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-start {
            background: var(--btn-start);
            color: white;
        }

        .btn-stop {
            background: var(--btn-stop);
            color: white;
        }

        .btn-update {
            background: #1bd1da;
            color: #0a192f;
        }

        .btn-live {
            background: #64ffda;
            color: #0a192f;
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .bg-green {
            background: #28a745;
            color: white;
        }

        .bg-red {
            background: #dc3545;
            color: white;
        }

        .bg-grey {
            background: #495057;
            color: white;
        }

        /* Gallery Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 12, 27, 0.95);
            overflow-y: auto;
        }

        .modal-content {
            margin: 5% auto;
            padding: 20px;
            width: 90%;
            max-width: 1000px;
            background: var(--container-bg);
            border-radius: 12px;
            border: 1px solid #233554;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #233554;
            margin-bottom: 20px;
            padding-bottom: 10px;
        }

        .close {
            color: #8892b0;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: var(--accent-green);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .gallery-item {
            cursor: pointer;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #233554;
            transition: transform 0.2s;
        }

        .gallery-item:hover {
            transform: scale(1.05);
            border-color: var(--accent-green);
        }

        .date-selector {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .date-btn {
            background: #172a45;
            color: var(--text-color);
            border: 1px solid #233554;
            padding: 8px 15px;
            border-radius: 4px;
            white-space: nowrap;
            cursor: pointer;
        }

        .date-btn.active {
            background: var(--accent-green);
            color: var(--bg-color);
            border-color: var(--accent-green);
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }

        #lightbox img {
            max-width: 95%;
            max-height: 95%;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        footer {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #233554;
            color: #8892b0;
            font-size: 0.8em;
        }

        .version-badge {
            background: #172a45;
            padding: 2px 8px;
            border-radius: 10px;
            color: var(--accent-blue);
            font-family: monospace;
        }

        @media (max-width: 600px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }

            .gallery-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Tony's Webcam Timelapse</h1>

        <div class="preview">
            <span class="live-badge" id="live-indicator">LIVE PREVIEW</span>
            <img id="main-display" src="" alt="Waiting for capture..." onerror="this.style.display='none'">
            <div id="no-image-text" style="display:none; color: #8892b0;">No images captured yet</div>
        </div>

        <button class="btn-live" id="btn-live" onclick="toggleLiveView()">Start Live View (Adjust Settings)</button>

        <div class="controls-grid">
            <!-- Left Column: Status & Timelapse Config -->
            <div class="panel" id="timelapse-panel">
                <h3>Timelapse Control</h3>
                <p>State: <span id="status-state" class="badge bg-grey">Checking...</span></p>
                <p>Shots Taken: <span id="status-shots" style="color: var(--accent-green)">0</span></p>
                <p>Errors: <span id="status-errors" style="color: #ff6b6b">0</span></p>

                <hr style="border-color: #233554">

                <label>Interval (Minutes)</label>
                <input type="number" id="interval" value="10" min="0.1" step="0.1">

                <label>Resolution</label>
                <select id="resolution">
                    <option value="1920x1080">Full HD (1920x1080)</option>
                    <option value="1280x720">HD (1280x720)</option>
                </select>

                <button class="btn-update" onclick="updateGenerals()">Update Config</button>
                <div id="action-buttons" style="margin-top: 15px;">
                    <button class="btn-start" onclick="toggleTimelapse('start')">Start Timelapse</button>
                </div>
            </div>

            <!-- Right Column: Image Settings -->
            <div class="panel" id="settings-panel">
                <h3>Image Settings</h3>

                <label>Brightness <span id="val-brightness" class="range-val">100</span></label>
                <input type="range" id="brightness" min="-100" max="100"
                    oninput="updateRangeVal(this, 'val-brightness')" onchange="updateImageSettings()">

                <label>Contrast <span id="val-contrast" class="range-val">100</span></label>
                <input type="range" id="contrast" min="0" max="255" oninput="updateRangeVal(this, 'val-contrast')"
                    onchange="updateImageSettings()">

                <label>Saturation <span id="val-saturation" class="range-val">100</span></label>
                <input type="range" id="saturation" min="0" max="255" oninput="updateRangeVal(this, 'val-saturation')"
                    onchange="updateImageSettings()">



                <div style="display: flex; align-items: center; margin-top: 10px; margin-bottom:10px;">
                    <input type="checkbox" id="auto_wb" onchange="toggleWB()" style="width: auto; margin:0 10px 0 0;">
                    <label style="margin:0;">Auto White Balance</label>
                </div>

                <div id="wb-manual-container">
                    <label>White Balance (Temp) <span id="val-wb" class="range-val">4000</span></label>
                    <input type="range" id="white_balance" min="2800" max="6500" step="100"
                        oninput="updateRangeVal(this, 'val-wb')" onchange="updateImageSettings()">
                </div>
            </div>
        </div>

        <button class="btn-update" style="margin-top: 25px; background: #233554; color: var(--accent-blue);"
            onclick="openGallery()">📂 Open Image Gallery</button>

        <footer>
            Tony's Timelapse System &bull; Version: <span class="version-badge">{{ version }}</span>
        </footer>
    </div>

    <!-- Gallery Modal -->
    <div id="gallery-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="margin:0; color: var(--accent-green);">Image Gallery</h2>
                <span class="close" onclick="closeGallery()">&times;</span>
            </div>

            <div id="gallery-dates" class="date-selector">
                <!-- Data populated via JS -->
            </div>

            <div id="gallery-images" class="gallery-grid">
                <!-- Images populated via JS -->
                <p style="grid-column: 1/-1; text-align: center; color: #8892b0;">Select a date to view images</p>
            </div>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" onclick="this.style.display='none'">
        <img id="lightbox-img" src="">
    </div>

    <script>
        let isRunning = false;
        let isLive = false;
        let pollingInterval = null;

        function updateRangeVal(input, displayId) {
            document.getElementById(displayId).textContent = input.value;
        }

        function toggleWB(skipUpdate = false) {
            const auto = document.getElementById('auto_wb').checked;
            document.getElementById('wb-manual-container').style.opacity = auto ? "0.5" : "1";
            document.getElementById('wb-manual-container').style.pointerEvents = auto ? "none" : "auto";
            if (!skipUpdate) updateImageSettings();
        }

        function fetchStatus() {
            if (isLive) return; // Don't poll status image if live view is on

            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    isRunning = data.running;

                    // Status Badge
                    const badge = document.getElementById('status-state');
                    if (data.running) {
                        badge.textContent = "RUNNING";
                        badge.className = "badge bg-green";
                        document.getElementById('action-buttons').innerHTML = '<button class="btn-stop" onclick="toggleTimelapse(\'stop\')">Stop Timelapse</button>';
                        document.getElementById('btn-live').disabled = true;
                        document.getElementById('btn-live').textContent = "Stop Timelapse to use Live View";
                        document.getElementById('btn-live').style.background = "#555";
                    } else {
                        badge.textContent = "STOPPED";
                        badge.className = "badge bg-red";
                        document.getElementById('action-buttons').innerHTML = '<button class="btn-start" onclick="toggleTimelapse(\'start\')">Start Timelapse</button>';
                        document.getElementById('btn-live').disabled = false;
                        document.getElementById('btn-live').textContent = "Start Live View (Adjust Settings)";
                        document.getElementById('btn-live').style.background = "#64ffda";
                    }

                    document.getElementById('status-shots').textContent = data.shots;
                    document.getElementById('status-errors').textContent = data.errors;

                    // Sync Inputs (only if not focused)
                    if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                        document.getElementById('interval').value = data.interval_mins;
                        const res = `${data.width}x${data.height}`;
                        document.getElementById('resolution').value = res;

                        // Image Settings
                        document.getElementById('brightness').value = data.settings.brightness;
                        document.getElementById('contrast').value = data.settings.contrast;
                        document.getElementById('saturation').value = data.settings.saturation;

                        document.getElementById('white_balance').value = data.settings.white_balance;
                        document.getElementById('auto_wb').checked = data.settings.auto_wb;

                        // Update range displays
                        updateRangeVal(document.getElementById('brightness'), 'val-brightness');
                        updateRangeVal(document.getElementById('contrast'), 'val-contrast');
                        updateRangeVal(document.getElementById('saturation'), 'val-saturation');

                        updateRangeVal(document.getElementById('white_balance'), 'val-wb');

                        toggleWB(true); // set visual state without triggering POST
                    }

                    // Update Image (if not live)
                    const img = document.getElementById('main-display');
                    const noImg = document.getElementById('no-image-text');
                    if (data.latest_image && !isLive) {
                        img.onload = () => { img.style.display = 'block'; noImg.style.display = 'none'; };
                        img.src = `/latest_image?t=${new Date().getTime()}`;
                    } else if (!isLive) {
                        img.style.display = 'none';
                        noImg.style.display = 'block';
                    }
                });
        }

        function toggleLiveView() {
            const img = document.getElementById('main-display');
            const badge = document.getElementById('live-indicator');
            const btn = document.getElementById('btn-live');
            const timelapsePanel = document.getElementById('timelapse-panel');

            if (isLive) {
                // Stop Live View
                isLive = false;
                img.src = ""; // Stop stream
                badge.style.display = 'none';
                btn.textContent = "Start Live View (Adjust Settings)";
                btn.style.background = "#64ffda";
                btn.style.color = "#0a192f";

                // Show Timelapse Panel
                timelapsePanel.style.display = 'block';
                document.querySelector('.controls-grid').style.gridTemplateColumns = "1fr 1fr"; // Restore grid

                // Resume polling status
                fetchStatus();
                pollingInterval = setInterval(fetchStatus, 2000);
            } else {
                // Start Live View
                isLive = true;
                clearInterval(pollingInterval); // Stop status polling
                img.style.display = 'block';
                document.getElementById('no-image-text').style.display = 'none';
                img.src = "/video_feed"; // Start MJPEG stream
                badge.style.display = 'block';
                btn.textContent = "Close Live View";
                btn.style.background = "#dc3545";
                btn.style.color = "white";

                // Hide Timelapse Panel for "Live Focus"
                timelapsePanel.style.display = 'none';
                document.querySelector('.controls-grid').style.gridTemplateColumns = "1fr"; // Full width
            }
        }

        function toggleTimelapse(action) {
            fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            }).then(() => fetchStatus());
        }

        function updateGenerals() {
            const interval = document.getElementById('interval').value;
            const resVal = document.getElementById('resolution').value;
            const [w, h] = resVal.split('x');

            fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'update',
                    interval: interval,
                    width: w,
                    height: h
                })
            }).then(() => {
                alert("General settings updated!");
                fetchStatus();
            });
        }

        function updateImageSettings() {
            // Debounce could be added here for sliders
            const payload = {
                brightness: document.getElementById('brightness').value,
                contrast: document.getElementById('contrast').value,
                saturation: document.getElementById('saturation').value,
                white_balance: document.getElementById('white_balance').value,
                auto_wb: document.getElementById('auto_wb').checked
            };

            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }

        // --- Gallery Logic ---
        let currentGalleryDate = null;

        function openGallery() {
            document.getElementById('gallery-modal').style.display = 'block';
            fetchDates();
        }

        function closeGallery() {
            document.getElementById('gallery-modal').style.display = 'none';
        }

        function fetchDates() {
            fetch('/api/gallery')
                .then(r => r.json())
                .then(dates => {
                    const container = document.getElementById('gallery-dates');
                    container.innerHTML = '';

                    if (dates.length === 0) {
                        container.innerHTML = '<p>No captures found.</p>';
                        return;
                    }

                    dates.forEach((date, index) => {
                        const btn = document.createElement('button');
                        btn.className = 'date-btn';
                        btn.innerText = formatDate(date);
                        btn.onclick = () => selectDate(date, btn);
                        container.appendChild(btn);

                        // Select first by default
                        if (index === 0 && !currentGalleryDate) {
                            selectDate(date, btn);
                        }
                    });
                });
        }

        function formatDate(dateStr) {
            // YYYYMMDD -> DD/MM/YYYY
            const y = dateStr.substring(0, 4);
            const m = dateStr.substring(4, 6);
            const d = dateStr.substring(6, 8);
            return `${d}/${m}/${y}`;
        }

        function selectDate(date, btn) {
            currentGalleryDate = date;

            // UI state
            document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            fetchImages(date);
        }

        function fetchImages(date) {
            const container = document.getElementById('gallery-images');
            container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">Loading images...</p>';

            fetch(`/api/gallery/${date}`)
                .then(r => r.json())
                .then(images => {
                    container.innerHTML = '';
                    if (images.length === 0) {
                        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center;">No images in this folder</p>';
                        return;
                    }

                    images.forEach(imgName => {
                        const div = document.createElement('div');
                        div.className = 'gallery-item';

                        const img = document.createElement('img');
                        img.src = `/images/${date}/${imgName}`;
                        img.loading = 'lazy';
                        img.onclick = () => showLightbox(img.src);

                        div.appendChild(img);
                        container.appendChild(div);
                    });
                });
        }

        function showLightbox(src) {
            const lb = document.getElementById('lightbox');
            const img = document.getElementById('lightbox-img');
            img.src = src;
            lb.style.display = 'flex';
        }

        // Close on escape
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeGallery();
                document.getElementById('lightbox').style.display = 'none';
            }
        });

        // Poll status every 2 seconds
        pollingInterval = setInterval(fetchStatus, 2000);
        fetchStatus();
    </script>
</body>

</html>
