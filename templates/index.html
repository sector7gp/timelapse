<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timelapse Control</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background: #f4f4f4; }
        .container { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .preview { text-align: center; margin: 20px 0; min-height: 300px; background: #eee; display: flex; align-items: center; justify-content: center; border-radius: 4px; overflow: hidden; }
        img { max-width: 100%; height: auto; display: block; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .status-panel { background: #eef; padding: 15px; border-radius: 4px; }
        .control-panel { background: #fee; padding: 15px; border-radius: 4px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: 5px; }
        .btn-start { background: #28a745; color: white; }
        .btn-stop { background: #dc3545; color: white; }
        .btn-update { background: #007bff; color: white; }
        .badge { display: inline-block; padding: 3px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .bg-green { background: #d4edda; color: #155724; }
        .bg-red { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Raspberry Pi Webcam Timelapse</h1>
        
        <div class="preview">
            <img id="latest-image" src="" alt="Waiting for capture..." onerror="this.style.display='none'">
            <div id="no-image-text" style="display:none; color: #777;">No images captured yet</div>
        </div>

        <div class="controls">
            <div class="status-panel">
                <h3>Status</h3>
                <p>State: <span id="status-state" class="badge">Checking...</span></p>
                <p>Shots Taken: <span id="status-shots">0</span></p>
                <p>Errors: <span id="status-errors">0</span></p>
                <p>Last Capture: <span id="status-last">None</span></p>
            </div>
            
            <div class="control-panel">
                <h3>Settings</h3>
                <label>Interval (seconds)</label>
                <input type="number" id="interval" value="10" min="1">
                
                <label>Resolution (Width)</label>
                <input type="number" id="width" value="1920">
                
                <label>Resolution (Height)</label>
                <input type="number" id="height" value="1080">

                <button class="btn-update" onclick="updateSettings()">Update Settings</button>
                <hr>
                <div id="action-buttons">
                    <button class="btn-start" onclick="toggleTimelapse('start')">Start Timelapse</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;

        function fetchStatus() {
            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    isRunning = data.running;
                    
                    // Update Status Panel
                    const badge = document.getElementById('status-state');
                    if (data.running) {
                        badge.textContent = "RUNNING";
                        badge.className = "badge bg-green";
                        document.getElementById('action-buttons').innerHTML = '<button class="btn-stop" onclick="toggleTimelapse(\'stop\')">Stop Timelapse</button>';
                    } else {
                        badge.textContent = "STOPPED";
                        badge.className = "badge bg-red";
                        document.getElementById('action-buttons').innerHTML = '<button class="btn-start" onclick="toggleTimelapse(\'start\')">Start Timelapse</button>';
                    }
                    
                    document.getElementById('status-shots').textContent = data.shots;
                    document.getElementById('status-errors').textContent = data.errors;
                    
                    // Update Inputs only if not focused (to avoid annoying user while typing)
                    if (document.activeElement.tagName !== 'INPUT') {
                        document.getElementById('interval').value = data.interval;
                        document.getElementById('width').value = data.width;
                        document.getElementById('height').value = data.height;
                    }

                    // Update Image
                    const img = document.getElementById('latest-image');
                    const noImg = document.getElementById('no-image-text');
                    if (data.latest_image) {
                        // Add timestamp to prevent caching
                        img.src = `/latest_image?t=${new Date().getTime()}`;
                        img.style.display = 'block';
                        noImg.style.display = 'none';
                        document.getElementById('status-last').textContent = data.latest_image;
                    } else {
                        img.style.display = 'none';
                        noImg.style.display = 'block';
                    }
                });
        }

        function toggleTimelapse(action) {
            fetch('/api/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({action: action})
            }).then(() => fetchStatus());
        }

        function updateSettings() {
            const interval = document.getElementById('interval').value;
            const width = document.getElementById('width').value;
            const height = document.getElementById('height').value;
            
            fetch('/api/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    action: 'update',
                    interval: interval,
                    width: width,
                    height: height
                })
            }).then(() => {
                alert("Settings updated!");
                fetchStatus();
            });
        }

        // Poll status every 2 seconds
        setInterval(fetchStatus, 2000);
        fetchStatus();
    </script>
</body>
</html>
