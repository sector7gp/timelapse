<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tony's Timelapse</title>
    <style>
        :root {
            --bg-color: #0a192f;
            --container-bg: #112240;
            --text-color: #ccd6f6;
            --accent-green: #64ffda;
            --accent-blue: #57cbff;
            --btn-start: #28a745;
            --btn-stop: #dc3545;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: var(--bg-color);
            color: var(--text-color);
        }

        .container {
            background: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            color: var(--accent-green);
            margin-bottom: 25px;
        }

        .preview {
            text-align: center;
            margin: 20px 0;
            min-height: 350px;
            background: #020c1b;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #233554;
            position: relative;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
            max-height: 500px;
        }

        .live-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: red;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-top: 25px;
        }

        .panel {
            background: #172a45;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #233554;
        }

        .panel h3 {
            margin-top: 0;
            color: var(--accent-blue);
            border-bottom: 1px solid #233554;
            padding-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9em;
            margin-top: 10px;
        }

        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            background: #0a192f;
            border: 1px solid #233554;
            color: white;
            border-radius: 4px;
        }

        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }

        .range-val {
            float: right;
            font-size: 0.8em;
            color: var(--accent-green);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-start {
            background: var(--btn-start);
            color: white;
        }

        .btn-stop {
            background: var(--btn-stop);
            color: white;
        }

        .btn-update {
            background: #1bd1da;
            color: #0a192f;
        }

        .btn-live {
            background: #64ffda;
            color: #0a192f;
            margin-bottom: 15px;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
        }

        .bg-green {
            background: #28a745;
            color: white;
        }

        .bg-red {
            background: #dc3545;
            color: white;
        }

        .bg-grey {
            background: #495057;
            color: white;
        }

        @media (max-width: 600px) {
            .controls-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Tony's Webcam Timelapse</h1>

        <div class="preview">
            <span class="live-badge" id="live-indicator">LIVE PREVIEW</span>
            <img id="main-display" src="" alt="Waiting for capture..." onerror="this.style.display='none'">
            <div id="no-image-text" style="display:none; color: #8892b0;">No images captured yet</div>
        </div>

        <button class="btn-live" id="btn-live" onclick="toggleLiveView()">Start Live View (Adjust Settings)</button>

        <div class="controls-grid">
            <!-- Left Column: Status & Timelapse Config -->
            <div class="panel" id="timelapse-panel">
                <h3>Timelapse Control</h3>
                <p>State: <span id="status-state" class="badge bg-grey">Checking...</span></p>
                <p>Shots Taken: <span id="status-shots" style="color: var(--accent-green)">0</span></p>
                <p>Errors: <span id="status-errors" style="color: #ff6b6b">0</span></p>

                <hr style="border-color: #233554">

                <label>Interval (Minutes)</label>
                <input type="number" id="interval" value="10" min="0.1" step="0.1">

                <label>Resolution</label>
                <select id="resolution">
                    <option value="1920x1080">Full HD (1920x1080)</option>
                    <option value="1280x720">HD (1280x720)</option>
                </select>

                <button class="btn-update" onclick="updateGenerals()">Update Config</button>
                <div id="action-buttons" style="margin-top: 15px;">
                    <button class="btn-start" onclick="toggleTimelapse('start')">Start Timelapse</button>
                </div>
            </div>

            <!-- Right Column: Image Settings -->
            <div class="panel" id="settings-panel">
                <h3>Image Settings</h3>

                <label>Brightness <span id="val-brightness" class="range-val">100</span></label>
                <input type="range" id="brightness" min="-100" max="100"
                    oninput="updateRangeVal(this, 'val-brightness')" onchange="updateImageSettings()">

                <label>Contrast <span id="val-contrast" class="range-val">100</span></label>
                <input type="range" id="contrast" min="0" max="255" oninput="updateRangeVal(this, 'val-contrast')"
                    onchange="updateImageSettings()">

                <label>Saturation <span id="val-saturation" class="range-val">100</span></label>
                <input type="range" id="saturation" min="0" max="255" oninput="updateRangeVal(this, 'val-saturation')"
                    onchange="updateImageSettings()">

                <label>Exposure <span id="val-exposure" class="range-val">0</span></label>
                <input type="range" id="exposure" min="-10" max="10" oninput="updateRangeVal(this, 'val-exposure')"
                    onchange="updateImageSettings()">

                <div style="display: flex; align-items: center; margin-top: 10px; margin-bottom:10px;">
                    <input type="checkbox" id="auto_wb" onchange="toggleWB()" style="width: auto; margin:0 10px 0 0;">
                    <label style="margin:0;">Auto White Balance</label>
                </div>

                <div id="wb-manual-container">
                    <label>White Balance (Temp) <span id="val-wb" class="range-val">4000</span></label>
                    <input type="range" id="white_balance" min="2800" max="6500" step="100"
                        oninput="updateRangeVal(this, 'val-wb')" onchange="updateImageSettings()">
                </div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let isLive = false;
        let pollingInterval = null;

        function updateRangeVal(input, displayId) {
            document.getElementById(displayId).textContent = input.value;
        }

        function toggleWB() {
            const auto = document.getElementById('auto_wb').checked;
            document.getElementById('wb-manual-container').style.opacity = auto ? "0.5" : "1";
            document.getElementById('wb-manual-container').style.pointerEvents = auto ? "none" : "auto";
            updateImageSettings();
        }

        function fetchStatus() {
            if (isLive) return; // Don't poll status image if live view is on

            fetch('/api/status')
                .then(r => r.json())
                .then(data => {
                    isRunning = data.running;

                    // Status Badge
                    const badge = document.getElementById('status-state');
                    if (data.running) {
                        badge.textContent = "RUNNING";
                        badge.className = "badge bg-green";
                        document.getElementById('action-buttons').innerHTML = '<button class="btn-stop" onclick="toggleTimelapse(\'stop\')">Stop Timelapse</button>';
                        document.getElementById('btn-live').disabled = true;
                        document.getElementById('btn-live').textContent = "Stop Timelapse to use Live View";
                        document.getElementById('btn-live').style.background = "#555";
                    } else {
                        badge.textContent = "STOPPED";
                        badge.className = "badge bg-red";
                        document.getElementById('action-buttons').innerHTML = '<button class="btn-start" onclick="toggleTimelapse(\'start\')">Start Timelapse</button>';
                        document.getElementById('btn-live').disabled = false;
                        document.getElementById('btn-live').textContent = "Start Live View (Adjust Settings)";
                        document.getElementById('btn-live').style.background = "#64ffda";
                    }

                    document.getElementById('status-shots').textContent = data.shots;
                    document.getElementById('status-errors').textContent = data.errors;

                    // Sync Inputs (only if not focused)
                    if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                        document.getElementById('interval').value = data.interval_mins;
                        const res = `${data.width}x${data.height}`;
                        document.getElementById('resolution').value = res;

                        // Image Settings
                        document.getElementById('brightness').value = data.settings.brightness;
                        document.getElementById('contrast').value = data.settings.contrast;
                        document.getElementById('saturation').value = data.settings.saturation;
                        document.getElementById('exposure').value = data.settings.exposure;
                        document.getElementById('white_balance').value = data.settings.white_balance;
                        document.getElementById('auto_wb').checked = data.settings.auto_wb;

                        // Update range displays
                        updateRangeVal(document.getElementById('brightness'), 'val-brightness');
                        updateRangeVal(document.getElementById('contrast'), 'val-contrast');
                        updateRangeVal(document.getElementById('saturation'), 'val-saturation');
                        updateRangeVal(document.getElementById('exposure'), 'val-exposure');
                        updateRangeVal(document.getElementById('white_balance'), 'val-wb');

                        toggleWB(); // set visual state
                    }

                    // Update Image (if not live)
                    const img = document.getElementById('main-display');
                    const noImg = document.getElementById('no-image-text');
                    if (data.latest_image && !isLive) {
                        img.onload = () => { img.style.display = 'block'; noImg.style.display = 'none'; };
                        img.src = `/latest_image?t=${new Date().getTime()}`;
                    } else if (!isLive) {
                        img.style.display = 'none';
                        noImg.style.display = 'block';
                    }
                });
        }

        function toggleLiveView() {
            const img = document.getElementById('main-display');
            const badge = document.getElementById('live-indicator');
            const btn = document.getElementById('btn-live');
            const timelapsePanel = document.getElementById('timelapse-panel');

            if (isLive) {
                // Stop Live View
                isLive = false;
                img.src = ""; // Stop stream
                badge.style.display = 'none';
                btn.textContent = "Start Live View (Adjust Settings)";
                btn.style.background = "#64ffda";
                btn.style.color = "#0a192f";

                // Show Timelapse Panel
                timelapsePanel.style.display = 'block';
                document.querySelector('.controls-grid').style.gridTemplateColumns = "1fr 1fr"; // Restore grid

                // Resume polling status
                fetchStatus();
                pollingInterval = setInterval(fetchStatus, 2000);
            } else {
                // Start Live View
                isLive = true;
                clearInterval(pollingInterval); // Stop status polling
                img.style.display = 'block';
                document.getElementById('no-image-text').style.display = 'none';
                img.src = "/video_feed"; // Start MJPEG stream
                badge.style.display = 'block';
                btn.textContent = "Close Live View";
                btn.style.background = "#dc3545";
                btn.style.color = "white";

                // Hide Timelapse Panel for "Live Focus"
                timelapsePanel.style.display = 'none';
                document.querySelector('.controls-grid').style.gridTemplateColumns = "1fr"; // Full width
            }
        }

        function toggleTimelapse(action) {
            fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: action })
            }).then(() => fetchStatus());
        }

        function updateGenerals() {
            const interval = document.getElementById('interval').value;
            const resVal = document.getElementById('resolution').value;
            const [w, h] = resVal.split('x');

            fetch('/api/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: 'update',
                    interval: interval,
                    width: w,
                    height: h
                })
            }).then(() => {
                alert("General settings updated!");
                fetchStatus();
            });
        }

        function updateImageSettings() {
            // Debounce could be added here for sliders
            const payload = {
                brightness: document.getElementById('brightness').value,
                contrast: document.getElementById('contrast').value,
                saturation: document.getElementById('saturation').value,
                exposure: document.getElementById('exposure').value,
                white_balance: document.getElementById('white_balance').value,
                auto_wb: document.getElementById('auto_wb').checked
            };

            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        }

        // Poll status every 2 seconds
        pollingInterval = setInterval(fetchStatus, 2000);
        fetchStatus();
    </script>
</body>

</html>
